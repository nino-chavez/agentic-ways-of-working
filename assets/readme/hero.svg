<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="376" viewBox="0 0 1200 376"
     role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Agentic Ways of Working</title>
  <desc id="heroDesc">One canonical principles document at principles/working-style.md, read by Claude Code, Codex, and Gemini through thin per-tool adapters instead of three drifting copies.</desc>

  <defs>
    <radialGradient id="amberWash" cx="0.78" cy="0" r="0.72">
      <stop offset="0" stop-color="#f5b942" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#f5b942" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="376" rx="24" fill="#0a0e14"/>
  <rect width="1200" height="376" rx="24" fill="url(#amberWash)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <!-- identity: the shell prompt this repo installs into -->
    <text x="56" y="80" font-size="17" fill="#3fb950">~/.claude</text>
    <path d="M154 68 l7 6 l-7 6" fill="none" stroke="#8b949e" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round"/>
    <text x="172" y="80" font-size="17" fill="#e6edf3">./install.sh</text>
    <rect x="302" y="66" width="10" height="19" fill="#f5b942"/>

    <!-- name -->
    <text x="56" y="160" font-size="52" font-weight="700" fill="#e6edf3">Agentic</text>
    <text x="56" y="216" font-size="52" font-weight="700" fill="#f5b942">Ways of Working</text>

    <!-- concrete description -->
    <text x="56" y="262" font-size="18" fill="#8b949e">The transferable layer between your dotfiles</text>
    <text x="56" y="288" font-size="18" fill="#8b949e">and a blog post — rules, skills, hooks that fire.</text>

    <line x1="56" y1="318" x2="560" y2="318" stroke="#1c2330" stroke-width="1"/>
    <g font-size="15">
      <text x="56" y="346" fill="#f5b942">MIT</text>
      <text x="94" y="346" fill="#8b949e">·</text>
      <text x="110" y="346" fill="#8b949e">harness-agnostic</text>
      <text x="266" y="346" fill="#8b949e">·</text>
      <text x="282" y="346" fill="#8b949e">one install script</text>
    </g>

    <!-- project structure: one doc, every harness -->
    <text x="660" y="80" font-size="16" fill="#8b949e" letter-spacing="1.6">ONE DOC → EVERY HARNESS</text>

    <rect x="660" y="120" width="214" height="76" rx="10" fill="#0e131c" stroke="#1c2330"/>
    <path d="M663 120 h8 v76 h-8 a3 3 0 0 1 -3 -3 v-70 a3 3 0 0 1 3 -3 z" fill="#f5b942"/>
    <text x="684" y="152" font-size="16" fill="#8b949e">principles/</text>
    <text x="684" y="176" font-size="17" fill="#e6edf3">working-style.md</text>

    <g stroke="#f5b942" stroke-opacity="0.32" stroke-width="1.5" fill="none">
      <path d="M874 158 C 916 158, 922 92, 964 92"/>
      <path d="M874 158 H 964"/>
      <path d="M874 158 C 916 158, 922 224, 964 224"/>
    </g>

    <g fill="#0e131c" stroke="#1c2330">
      <rect x="964" y="66" width="180" height="52" rx="8"/>
      <rect x="964" y="132" width="180" height="52" rx="8"/>
      <rect x="964" y="198" width="180" height="52" rx="8"/>
    </g>
    <g font-size="17" fill="#e6edf3">
      <text x="984" y="98">CLAUDE.md</text>
      <text x="984" y="164">AGENTS.md</text>
      <text x="984" y="230">GEMINI.md</text>
    </g>

    <text x="660" y="300" font-size="16" fill="#8b949e">adapters are thin pointers, not copies</text>
  </g>
</svg>
